<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signin Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-black text-white">
    <div class="container d-flex flex-column justify-content-center vh-100">
      <div class="rounded-4 bg-white text-black px-4 py-3 shadow-lg">
        <div class="container d-flex justify-content-center mt-5">
          <h2>Sign In</h2>
        </div>
        <form action="" id="forminput">
          <div class="container">
            <label for="Email" class="mt-3">Email:</label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Enter Your Email"
              required
              class="form-control mt-1"
            />
            <p class="error"></p>
          </div>
          <div class="container">
            <label for="password" class="mt-3">Password:</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter Your password"
              class="form-control mt-1"
            />
            <p class="passerror"></p>
          </div>
          <div class="container">
            <button class="btn btn-primary mt-3 w-100" id="signin" type="submit">
              Sign In
            </button>
          </div>
        </form>
        <p class="text-center mt-3">
          don't have a account?<a href="signup.html">Create Account</a>
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
