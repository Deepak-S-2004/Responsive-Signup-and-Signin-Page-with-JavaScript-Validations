<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-black text-white">
    <div class="container d-flex flex-column justify-content-center  min-vh-100 py-4">
      <div class="rounded-4 bg-white text-black px-4 py-3 shadow-lg">
        <div class="container d-flex justify-content-center mt-5">
          <h2>Create Account</h2>
        </div>
        <form action="" id="formsignup">
            <div class="container">
            <label for="name" class="mt-3">Full Name:</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Enter Your name"
             
              class="form-control mt-1"
            />
            </div>
          <div class="container">
            <label for="Email" class="mt-3">Email:</label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Enter Your Email"
             
              class="form-control mt-1"
            />
            <p class="error"></p>
          </div>
               <div class="container">
            <label for="phone number" class="mt-3">Phone Number:</label>
            <input
              type="number"
              name="phone"
              id="phone"
              placeholder="Enter Your number"
              
              class="form-control mt-1"
            />
            <p class="phoneerror"></p>
            </div>
                 <div class="container">
            <label for="location" class="mt-3">city/location:</label>
            <input
              type="text"
              name="location"
              id="location"
              placeholder="Enter Your city"
             
              class="form-control mt-1"
            />
            <p class="cityerror"></p>
            </div>
          <div class="container">
            <label for="password" class="mt-3">Password:</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter Your password"
            
              class="form-control mt-1"
            />
            <p class="passerror"></p>
          </div>
          <div class="container">
            <label for="confirm password" class="mt-3">Confirm Password:</label>
            <input
              type="password"
              name="password"
              id="confirmpassword"
              placeholder="confirm Your password"
              
              class="form-control mt-1"
            />
            <p class="confirmpasserror"></p>
          </div>
          <div class="container">
            <button class="btn btn-primary mt-3 w-100" id="signup" type="submit">
              Sign up
            </button>
          </div>
        </form>
        <p class="text-center mt-3">
          Already have a account?<a href="index.html">signin</a>
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
